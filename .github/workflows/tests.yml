name: SWVO Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@main
        with:
          version: "latest"

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@main

      - name: Set up Python
        run: uv python install

      - name: Install project and ty
        run: |
          uv venv
          uv pip install . ty -U
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run ty
        run: ty check

  tests:
    needs: [ruff]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install .
          uv pip install coveralls coverage pytest-cov

      - name: Run tests
        run: uv run python -m coverage run --source swvo -m pytest -rf tests

      - name: Run Coveralls
        if: ${{ success() && matrix.python-version == '3.11' }}
        run: |
          uv run coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
