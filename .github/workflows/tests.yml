name: SWVO Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@main
        with:
          version: "latest"

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@main
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install project and ty
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run ty
        run: ty check

  tests:
    needs: [ruff]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          uv pip install coveralls coverage pytest-cov

      - name: Resolve zenodo checksum for cache key
        id: zenodo-record
        run: |
          DOI=$(grep -oP 'DOI="\K[^"]+' download_data_for_tests.sh)
          uv run zenodo_get --doi "${DOI}" --md5 --output-dir /tmp/zenodo-md5
          echo "id=$(md5sum /tmp/zenodo-md5/md5sums.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache test data
        id: cache-test-data
        uses: actions/cache@v6
        with:
          path: |
            tests/io/dst/data
            tests/io/f10_7/data
            tests/io/hp/data
            tests/io/kp/data
            tests/io/omni/data
            tests/io/RBMDataSet/data
            tests/io/solar_wind/data
          key: zenodo-test-data-${{ steps.zenodo-record.outputs.id }}

      - name: Download test data
        if: steps.cache-test-data.outputs.cache-hit != 'true'
        run: ./download_data_for_tests.sh

      - name: Run tests
        run: uv run python -m coverage run --source swvo -m pytest -rf tests

      - name: Run Coveralls
        if: ${{ success() && matrix.python-version == '3.11' }}
        run: |
          uv run coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
