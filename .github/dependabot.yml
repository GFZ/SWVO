version: 2
updates:
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 8 * * 2,5"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 0
